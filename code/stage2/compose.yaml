name: csc640-equipment-stage2
services:
  mysql:
    image: mysql:8.4
    ports: ["127.0.0.1:33642:3306"]
    environment:
      MYSQL_DATABASE: csc640_equipment_stage2
      MYSQL_USER: equipment_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run prepare.sh}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run prepare.sh}
    volumes: [stage2_db:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -uequipment_app -D csc640_equipment_stage2 -e "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      retries: 40
  php:
    build: .
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: local
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: csc640_equipment_stage2
      DB_USERNAME: equipment_app
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    depends_on:
      mysql:
        condition: service_healthy
  nginx:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:8642:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [php]
volumes:
  stage2_db:
