<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8f0eb">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <title>Todo List | JavaScript</title>
</head>
<body>
  <main>
    <h1>Todo List</h1>
    <p class="subtitle">JavaScript</p>
    <form id="todo-form">
      <label for="todo-text">New task</label>
      <div class="input-row">
        <input id="todo-text" type="text" placeholder="Enter a task" autocomplete="off">
        <button class="primary" type="submit">Add</button>
      </div>
    </form>
    <ul id="todo-list" aria-label="Tasks"></ul>
    <div class="footer">
      <p id="summary" aria-live="polite"></p>
      <button id="clear-completed" class="secondary" type="button">Clear Completed</button>
    </div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
